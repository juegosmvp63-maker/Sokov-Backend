<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SokovmcDigital - Panel Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-white font-sans min-h-screen p-6">
  <div class="max-w-6xl mx-auto">
    <header class="flex justify-between items-center mb-8 border-b border-slate-800 pb-4">
      <h1 class="text-3xl font-black text-cyan-400">🛡️ SokovmcDigital - Panel de Control</h1>
      <button onclick="cargarOrdenes()" class="bg-blue-600 hover:bg-blue-500 px-4 py-2 rounded-xl text-sm font-bold transition">🔄 Actualizar Pedidos</button>
    </header>

    <div class="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden shadow-2xl">
      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="bg-slate-950 text-slate-400 text-xs uppercase tracking-wider border-b border-slate-800">
              <th class="p-4">ID Pedido</th>
              <th class="p-4">Juego / Paquete</th>
              <th class="p-4">ID Jugador & Teléfono</th>
              <th class="p-4">Pago & Ref</th>
              <th class="p-4">Comprobante</th>
              <th class="p-4">Estado</th>
              <th class="p-4">Acciones</th>
            </tr>
          </thead>
          <tbody id="orders-table" class="divide-y divide-slate-800 text-sm">
            <!-- Se carga vía JavaScript -->
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    async function cargarOrdenes() {
      const res = await fetch('/api/admin/orders');
      const data = await res.json();
      const tbody = document.getElementById('orders-table');
      tbody.innerHTML = '';

      if(!data.orders || data.orders.length === 0) {
        tbody.innerHTML = `<tr><td colspan="7" class="p-6 text-center text-slate-500">No hay pedidos registrados por el momento.</td></tr>`;
        return;
      }

      data.orders.forEach(o => {
        let badgeColor = o.status === 'approved' ? 'bg-emerald-500/20 text-emerald-400 border-emerald-500/30' : (o.status === 'rejected' ? 'bg-rose-500/20 text-rose-400 border-rose-500/30' : 'bg-amber-500/20 text-amber-400 border-amber-500/30');
        
        tbody.innerHTML += `
          <tr class="hover:bg-slate-800/50 transition">
            <td class="p-4 font-mono text-xs text-slate-400">${o.id}</td>
            <td class="p-4">
              <span class="font-bold block text-white">${o.game}</span>
              <span class="text-xs text-slate-400">${o.package_name}</span>
            </td>
            <td class="p-4">
              <span class="font-mono text-cyan-300 block font-bold">ID: ${o.player_id}</span>
              <span class="text-xs text-slate-400">📞 ${o.phone}</span>
            </td>
            <td class="p-4">
              <span class="font-semibold block text-white">${o.payment_method}</span>
              <span class="font-mono text-xs text-slate-400">Ref: ${o.reference}</span>
            </td>
            <td class="p-4">
              ${o.receipt ? `<a href="${o.receipt}" target="_blank" class="text-blue-400 underline font-semibold text-xs hover:text-blue-300">🖼️ Ver Comprobante</a>` : 'Sin captura'}
            </td>
            <td class="p-4">
              <span class="px-3 py-1 rounded-full text-xs font-bold border ${badgeColor}">${o.status.toUpperCase()}</span>
            </td>
            <td class="p-4 space-x-2">
              <button onclick="cambiarEstado('${o.id}', 'approve')" class="bg-emerald-600 hover:bg-emerald-500 text-xs px-3 py-1.5 rounded-lg font-bold transition active:scale-95">Aprobar</button>
              <button onclick="cambiarEstado('${o.id}', 'reject')" class="bg-rose-600 hover:bg-rose-500 text-xs px-3 py-1.5 rounded-lg font-bold transition active:scale-95">Rechazar</button>
            </td>
          </tr>
        `;
      });
    }

    async function cambiarEstado(id, action) {
      const res = await fetch(`/api/admin/orders/${id}/action`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action })
      });
      const data = await res.json();
      if(data.success) {
        cargarOrdenes();
      } else {
        alert('Error al actualizar el estado del pedido');
      }
    }

    cargarOrdenes();
  </script>
</body>
</html>
